<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#173D32" />
      <stop offset="70%" stop-color="#0F2821" />
      <stop offset="100%" stop-color="#081814" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2E3C6" />
      <stop offset="35%" stop-color="#DFCA9E" />
      <stop offset="70%" stop-color="#C5A46D" />
      <stop offset="100%" stop-color="#9A7E4F" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer background circle -->
  <circle cx="256" cy="256" r="244" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="16" />

  <!-- Inner ornate ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="10 6" opacity="0.75" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.5" />

  <!-- Sacred Vedic ॐ (Om) Symbol -->
  <text 
    x="256" 
    y="228" 
    font-family="'Noto Serif Devanagari', 'Mangal', 'Yashomudra', 'Georgia', serif" 
    font-size="200" 
    font-weight="bold" 
    fill="url(#goldGrad)" 
    text-anchor="middle" 
    dominant-baseline="central"
    filter="url(#goldGlow)"
  >ॐ</text>

  <!-- Institutional Monogram SHAMC -->
  <text 
    x="256" 
    y="368" 
    font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" 
    font-size="52" 
    font-weight="800" 
    letter-spacing="10" 
    fill="url(#goldGrad)" 
    text-anchor="middle"
    dominant-baseline="central"
    filter="url(#goldGlow)"
  >SHAMC</text>

  <!-- Ornate flanking stars -->
  <path d="M 120 368 Q 128 368 128 360 Q 128 368 136 368 Q 128 368 128 376 Q 128 368 120 368 Z" fill="url(#goldGrad)" />
  <path d="M 376 368 Q 384 368 384 360 Q 384 368 392 368 Q 384 368 384 376 Q 384 368 376 368 Z" fill="url(#goldGrad)" />
</svg>
